name: Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next release without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --prefix .github/release --ignore-scripts
      - run: node --test .github/release/policy.test.cjs

  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Native modules need their install scripts; CUDA is not used.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check --if-present
      - run: npm test --if-present
      - run: npm pack --dry-run --ignore-scripts

  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix .github/release --ignore-scripts
      - run: node --test .github/release/policy.test.cjs
      - name: Skip a superseded checkout
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$remote_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision will be released."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify an already published package
        id: published
        run: node .github/release/already-published.cjs
      - name: Publish version and GitHub release
        if: steps.current.outputs.publish == 'true' && steps.published.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node .github/release/node_modules/semantic-release/bin/semantic-release.js \
            --extends ./.github/release/config.cjs "${args[@]}"
