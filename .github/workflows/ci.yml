name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - run: npm ci

      - name: Typecheck and immutability gate
        run: npm run check

      - name: Unit tests
        run: npm test

      # tests/integration/pi.test.ts spawns the real binary; without it the
      # suite fails with ENOENT rather than skipping, so pi is installed here
      # deliberately rather than the test being made conditional.
      - name: Integration tests
        run: |
          npm i -g @earendil-works/pi-coding-agent@0.85.1
          npm run test:integration

      # Downloads the sentence encoder on a cold runner, so it is cached
      # between runs and given its own generous step timeout.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Retrieval gate
        run: npm run eval

      - name: Package contents
        run: npm run check:package
